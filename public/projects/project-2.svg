<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#1a0f2e"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- Chat interface -->
  <rect x="120" y="50" width="560" height="400" rx="16" fill="#12121f" stroke="#ffffff08" stroke-width="1"/>
  <!-- Header -->
  <rect x="120" y="50" width="560" height="50" rx="16" fill="#1a1a2e"/>
  <rect x="120" y="84" width="560" height="16" fill="#1a1a2e"/>
  <circle cx="155" cy="75" r="14" fill="url(#accent2)" opacity="0.4"/>
  <rect x="180" y="69" width="100" height="12" rx="3" fill="#ffffff20"/>
  <!-- Chat bubbles -->
  <rect x="150" y="130" width="260" height="50" rx="12" fill="#ffffff06" stroke="#ffffff06" stroke-width="1"/>
  <rect x="150" y="140" width="200" height="8" rx="2" fill="#ffffff15"/>
  <rect x="150" y="155" width="160" height="8" rx="2" fill="#ffffff10"/>
  <rect x="350" y="210" width="300" height="60" rx="12" fill="url(#accent2)" opacity="0.12"/>
  <rect x="370" y="225" width="230" height="8" rx="2" fill="#ffffff20"/>
  <rect x="370" y="240" width="180" height="8" rx="2" fill="#ffffff15"/>
  <rect x="150" y="300" width="220" height="45" rx="12" fill="#ffffff06" stroke="#ffffff06" stroke-width="1"/>
  <rect x="150" y="312" width="170" height="8" rx="2" fill="#ffffff12"/>
  <rect x="150" y="326" width="130" height="8" rx="2" fill="#ffffff08"/>
  <!-- Input bar -->
  <rect x="145" y="380" width="510" height="42" rx="21" fill="#ffffff06" stroke="#ffffff08" stroke-width="1"/>
  <rect x="175" y="396" width="120" height="10" rx="3" fill="#ffffff10"/>
  <!-- Glow effects -->
  <circle cx="500" cy="250" r="200" fill="#8b5cf6" opacity="0.03"/>
  <circle cx="250" cy="200" r="150" fill="#ec4899" opacity="0.02"/>
</svg>
